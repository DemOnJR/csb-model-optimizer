[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
csb-mdl = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Layout and gzip over hundreds of MB are slow unoptimised; optimise even in dev and tests.
[profile.dev]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3
