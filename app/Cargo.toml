[package]
name = "csb-model-optimizer"
description = "Shrinks a CS 1.6 server's downloads: model animation repack/share plus .gz copies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csb-mdl.workspace = true
serde.workspace = true
serde_json.workspace = true
# custom-protocol: always serve ui/ from the exe (no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
